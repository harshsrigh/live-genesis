# Local use only. The database lives in ./data on your machine; it is not copied into the image.
# No service here gets a provider API key except `paid`.
services:
  test:            # docker compose run --rm test
    build: .
    command: ["python", "-m", "pytest", "-q"]
    environment:
      LIVE_DB: /tmp/unused.db   # tests use their own temporary databases

  cli:             # docker compose run --rm cli init | archive-status | archive-plan | demo-archive ...
    build: .
    entrypoint: ["python", "-m", "live_genesis.cli"]
    command: ["archive-status"]
    volumes:
      - ./data:/data

  web:             # docker compose up web  ->  http://127.0.0.1:8000  (read-only; run `cli init` once first)
    build: .
    command: ["python", "-m", "uvicorn", "live_genesis.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"   # reachable from this computer only
    volumes:
      - ./data:/data

  paid:            # The PAID command only (archive-run). Needs ./.env; started only on the owner's request:
    profiles: ["paid"]   # docker compose --profile paid run --rm paid archive-run --max-usd 0.05
    build: .
    entrypoint: ["python", "-m", "live_genesis.cli"]
    volumes:
      - ./data:/data
      - ./.env:/app/.env:ro
