# Tests the project, then rebuilds the public snapshot on the gh-pages branch.
# No model is called and no secret is used. The public site is the chat-app comparison of
# Answers Over Time alone; no model-track page or data and no script is published. Every build
# passes --archive-only, which says so (the flag is accepted and is the only kind of build).
#   - No published/ folder: the SCRIPTED-DEMO snapshot is the whole site (the exporter refuses
#     anything that is not scripted demo data).
#   - published/ present: it must be intact and approved (python -m live_genesis.snapshot --check).
#     Then the reviewed data is the whole site; the scripted sample is not built beside it.
#     If the check fails, the job fails and NOTHING is published; the site stays as it was.
# See docs/ANSWERS-OVER-TIME.md. Deleting published/ returns the site to the demo.
name: Tests and demo snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  snapshot:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to update the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Reviewed data must be intact and approved (fails the job, nothing is published)
        run: |
          if [ -e published ]; then
            python -m live_genesis.snapshot --check published
            echo "HAVE_PUBLISHED=1" >> "$GITHUB_ENV"
          else
            echo "No published/ folder: the scripted demo is the whole site."
          fi
      - name: Build scripted demo archive (no model calls)
        run: |
          echo "LIVE_DB=$RUNNER_TEMP/demo.db" >> "$GITHUB_ENV"
          export LIVE_DB="$RUNNER_TEMP/demo.db"
          python -m live_genesis.cli demo-archive
      - name: Export static snapshot
        env:
          # The public address, for the "Share on Facebook" links only. Every other link is relative.
          LIVE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # The pages link to a picture of each share card (card/<ID>.png); the next step makes them.
          LIVE_CARD_IMAGES: "YES"
        run: |
          if [ "${HAVE_PUBLISHED:-}" = "1" ]; then
            # Rendered from the reviewed JSON, no database. Once real answers are published the scripted
            # sample is not part of the site (owner's decision, 20 Nov 2026): no demo/ folder, no link to one.
            # The public site holds the chat-app comparison and nothing of the model track.
            python -m live_genesis.snapshot "$RUNNER_TEMP/site" --from-data published --archive-only
            echo "SNAPSHOT_KIND=reviewed recorded data only" >> "$GITHUB_ENV"
          else
            python -m live_genesis.snapshot "$RUNNER_TEMP/site" --archive-only
            echo "SNAPSHOT_KIND=scripted demo data only" >> "$GITHUB_ENV"
          fi
      - name: Make a picture of every share card (for Instagram, TikTok and link previews)
        # A pinned browser tool, used only to photograph the pages built above. It reads the site folder and
        # nothing else, calls no model and opens no other site. If it fails, nothing is published.
        run: |
          mkdir "$RUNNER_TEMP/camera" && cd "$RUNNER_TEMP/camera"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/camera/node_modules" node "$GITHUB_WORKSPACE/scripts/capture-cards.mjs" \
            --site "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/site/archive/card" --set chat
          ls "$RUNNER_TEMP/site/archive/card"/*.png | wc -l
      - name: Publish to gh-pages
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static archive snapshot ($SNAPSHOT_KIND) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
