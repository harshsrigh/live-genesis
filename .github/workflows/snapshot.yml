# Tests the project, then rebuilds the public snapshot on the gh-pages branch.
# No model is called and no secret is used.
#   - No published/ folder: the SCRIPTED-DEMO snapshot is the whole site (the exporter refuses
#     anything that is not scripted demo data).
#   - published/ present: it must be intact and approved (python -m live_genesis.snapshot --check).
#     Then the reviewed data is rendered at the site root and the scripted demo under demo/.
#     If the check fails, the job fails and NOTHING is published; the site stays as it was.
# See docs/FIRST-REAL-ROUND.md. Deleting published/ returns the site to the demo.
name: Tests and demo snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  snapshot:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to update the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Reviewed data must be intact and approved (fails the job, nothing is published)
        run: |
          if [ -e published ]; then
            python -m live_genesis.snapshot --check published
            echo "HAVE_PUBLISHED=1" >> "$GITHUB_ENV"
          else
            echo "No published/ folder: the scripted demo is the whole site."
          fi
      - name: Build scripted demo world (no model calls)
        run: |
          echo "LIVE_DB=$RUNNER_TEMP/demo.db" >> "$GITHUB_ENV"
          export LIVE_DB="$RUNNER_TEMP/demo.db"
          python -c "from live_genesis.core import seed_agents; seed_agents()"
          python -m live_genesis.cli demo
          python -m live_genesis.cli demo-game
          python -m live_genesis.cli demo-document
          python -m live_genesis.cli demo-archive
      - name: Export static snapshot
        run: |
          if [ "${HAVE_PUBLISHED:-}" = "1" ]; then
            # Root: rendered from the reviewed JSON, no database. demo/: the scripted demo.
            python -m live_genesis.snapshot "$RUNNER_TEMP/site" --from-data published --sibling demo/
            python -m live_genesis.snapshot "$RUNNER_TEMP/site/demo" --sibling ../
            echo "SNAPSHOT_KIND=reviewed recorded data at the root, scripted demo under demo/" >> "$GITHUB_ENV"
          else
            python -m live_genesis.snapshot "$RUNNER_TEMP/site"
            echo "SNAPSHOT_KIND=scripted demo data only" >> "$GITHUB_ENV"
          fi
      - name: Publish to gh-pages
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static observatory snapshot ($SNAPSHOT_KIND) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
